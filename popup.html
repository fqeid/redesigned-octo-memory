<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Tab Management</title>
</head>
<body>
  <header>
    <h1>Tab Management</h1>
    <p id="summary">Loading tabs in the current window…</p>
  </header>

  <div class="controls">
    <label for="group">Tab group</label>
    <select id="group" disabled></select>
    <button id="discard-group" class="primary" disabled>Discard selected group</button>
    <button id="refresh">Refresh</button>
  </div>

  <div class="table-wrap" tabindex="0" aria-label="Tabs in the current window">
    <table>
      <thead><tr><th>URL</th><th>Status</th><th>Last active</th><th>Action</th></tr></thead>
      <tbody id="tabs"></tbody>
    </table>
  </div>

  <p id="notice" role="status"></p>
  <footer>
    <span id="telemetry-status"></span>
    <button id="send" disabled>Report all windows</button>
  </footer>
  <p id="upload-result" role="status" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
